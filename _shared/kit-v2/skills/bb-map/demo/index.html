<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>bb-map demo</title>
<style>
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 400; src: url('../../../assets/fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2'); }
  html, body { margin: 0; background: #0a2f5c; color: #eef6ff; font: 16px 'IBM Plex Mono', monospace; }
  pre { padding: 20px; }
</style>
</head>
<body>
<pre id="out">bb-map demo</pre>
<script src="../../../src/prng.js"></script>
<script src="../../../src/tokens.js"></script>
<script src="../../../src/scenereport.js"></script>
<script src="../../../src/draw.js"></script>
<script src="../../../src/maps.js"></script>
<script>
(function () {
  const BB = window.BB;
  BB.installSeed('bb-map-demo');
  const T = BB.tokens('orbit', 1920, 1080);
  window.EPISODE = {
    map: {
      nodes: [
        { id: 'sawli', label: 'SAWLI', x: 0.14, y: 0.62, source: 'F01' },
        { id: 'vikhroli', label: 'VIKHROLI', x: 0.46, y: 0.44, source: 'F01' },
        { id: 'bkc', label: 'BKC', x: 0.80, y: 0.58, source: 'F01' },
      ],
      routes: [{ id: 'sawli-bkc', nodes: ['sawli', 'vikhroli', 'bkc'], source: 'F01' }],
      footprints: [{ id: 'creek', label: 'THANE CREEK', source: 'F01' }],
    },
  };
  const c = document.createElement('canvas');
  c.width = 1920; c.height = 1080;
  document.body.appendChild(c);
  const ctx = c.getContext('2d');
  BB.report.begin(0, 'demo');
  BB.draw.paper(ctx, 1920, 1080, T);
  const page = { T, t: 1, p: 1, ctx, beat: { id: 'demo', t0: 0 }, heroes: new Map(), threeHeroes: [] };
  BB.map.draw(ctx, T, { op: 'map', kind: 'terrain' }, page);
  BB.map.draw(ctx, T, { op: 'map', kind: 'pins' }, page);
  BB.map.draw(ctx, T, { op: 'map', kind: 'route', route: 'sawli-bkc' }, page);
  BB.map.draw(ctx, T, { op: 'map', kind: 'footprint', cx: 700, cy: 540, r: 210, label: '7 KM OF 10 KM UNDER THE CREEK', source: 'PIB, 18 JUL 2026' }, page);
  const items = BB.report.items();
  window.__gallery = { skill: 'bb-map', items: items.length, borders: items.filter((i) => i.tag === 'border').length };
  document.getElementById('out').textContent = [
    'bb-map demo: 3 pins, 1 route, 1 footprint, a wide-to-local zoom.',
    'items registered: ' + items.length,
    'items tagged border: ' + window.__gallery.borders + ' (QC B16)',
  ].join('\n');
  document.title = 'bb-map demo ready';
})();
</script>
</body>
</html>

  @font-face { font-family: 'Space Mono'; font-weight: 400; src: url('assets/fonts/space-mono-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Space Mono'; font-weight: 700; src: url('assets/fonts/space-mono-latin-700-normal.woff2') format('woff2'); }

<script>
  // Adapter: Hyperframes (or any caller) seeks time; every frame is a pure function of t.
  const fontsReady = Promise.all(['400 28px "IBM Plex Mono"', '600 28px "IBM Plex Mono"', '400 28px "Space Mono"', '700 28px "Space Mono"']
    .map((f) => document.fonts.load(f))).then(() => document.fonts.ready).catch(() => {});
  window.__hf = { duration: window.DURATION, seek: (t) => window.seek(t) };
  window.addEventListener('hf-seek', (e) => { e.detail.waitUntil(fontsReady.then(() => window.seek(e.detail.time))); });
  fontsReady.then(() => window.seek(0));
</script>
